schema_version: 1
bundle_id: bundle.relationship-bridge
book:
  title: 亲密关系：通往灵魂的桥梁
  author: Christopher Moon
  source_pack: relationship-bridge
  baseline_tag: cn2012-print2013
entry:
  name: relationship-bridge
  description: '当用户在亲密关系中反复失望、争吵、讨好、牺牲、害怕不被爱，或想用《亲密关系：通往灵魂的桥梁》的方法整理一次具体互动时使用；也处理本书概览和术语。先按意图只读一张对应能力卡。仅用于自愿的日常反思、沟通草稿与小行动；不用于危机干预、治疗、替人判断伴侣真实意愿或自动裁决关系去留。Triggers:
    relationship, needs, conflict, guilt, dialogue。'
  core_principles:
  - 把可观察事实、自己的感受和对方行为责任分开，不把所有问题解释成旧伤。
  - 先读路由表，只加载与当前意图最相近的一张卡；必要时组合最多两张。
  - 承认有需要自然；探索是否把某种特定行为当作自身价值的唯一证明。
  - 采用自愿、可停止的小范围反思；未知就保留未知，不替用户报告身体或情绪变化。
  - 原书的灵魂、投射等是解释体系；意象是可选表达，不能当作实体或疗效证据。
  - 完成标准是清楚的记录、表达或可执行下一步；是否和好与对方是否改变均不由方法保证。
  - 关系可以结束；不以宽恕、留下、感谢伤害或揽下责任作为成熟指标。
  out_of_scope:
  - 当前存在暴力、威胁、胁迫等需优先处理的危险情境：停止普通关系练习，转向现实保护与相应支持。
  - 自伤/自杀危机、创伤治疗、性障碍或身体症状的诊断治疗。
  - 与本书及关系任务无关的信息查询、医学因果核验、替伴侣读心，或要求系统裁决最正确的分手/复合决定。
  stop_conditions:
  - 必要事实缺失时先问最少信息；不能从一句抱怨推出童年创伤、人格或动机。
  - 用户不愿、无法想象、练习更难受或需要现实行动时，停止并如实记录；不为平静无限深入。
  - 若路由与索引没有对应意图，说明超出此包范围。
router_entry:
  name: relationship-bridge-router
  description: '当用户在亲密关系中反复失望、争吵、讨好、牺牲、害怕不被爱，或想用《亲密关系：通往灵魂的桥梁》的方法整理一次具体互动时使用；也处理本书概览和术语。先按意图只读一张对应能力卡。仅用于自愿的日常反思、沟通草稿与小行动；不用于危机干预、治疗、替人判断伴侣真实意愿或自动裁决关系去留。Triggers:
    relationship, needs, conflict, guilt, dialogue。 Pack中具体的期望/八问沟通/戏剧三角/两难/牺牲任务由相应独立入口处理；本入口处理其余卡片和整书查询。'
promotion_budget: 8
