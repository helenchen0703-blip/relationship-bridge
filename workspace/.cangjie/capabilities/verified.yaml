- capability_id: cap.relationship-bridge.expectation-needs
  revision: 1
  status: active
  slug: expectation-needs
  title: 识别期望背后的需求
  importance: high
  importance_rationale: 覆盖T02；阻止把行为命令当成情绪需求，输出更清楚的自我观察。
  one_liner: 写希望对方做的事→问想获得何种感受→若仍是行动要求则再问→自选是否松开必须由对方满足的要求→观察变化。
  intents:
  - 我总觉得伴侣应该证明在乎我，想分清期望与内在需要
  keywords:
  - 期望
  - 需求
  - 应该
  - 证明爱
  - expectation
  - needs
  also_read:
  - cap.relationship-bridge.eight-question-dialogue
  card: cards/expectation-needs.md
  resources:
  - resources/source-notes.md
  - resources/cases.md
  - resources/counter-examples.md
  - resources/test-prompts.json
  - resources/test-results.md
  frontmatter:
    description: 当用户说‘我总觉得伴侣应该证明在乎我，想分清期望与内在需要’时使用。只辨认自己的行为期望、内在渴望和放手意愿，不保证内在力量满足所有需求。
    tags:
    - relationship
    - self-reflection
  source_evidence:
